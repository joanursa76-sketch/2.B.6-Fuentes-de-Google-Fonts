<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Práctica 2.B.6 Importar fuentes</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Lora&family=McLaren&family=Monoton&family=Oswald&display=swap');

        h1 {
            font-family: 'Monoton', cursive;
        }

        h2 {
            font-family: 'Lora', serif;
        }

        h3 {
            font-family: 'Oswald', sans-serif;
        }

        p {
            font-family: 'McLaren', cursive;
        }
    </style>
</head>
<body>

    <h1>Soy un H1 con fuente 'Monoton'</h1>
    <h2>Soy un H2 con fuente 'Lora'</h2>
    <h3>Soy un H3 con fuente 'Oswald'</h3>
    <p>Soy un párrafo con fuente McLaren</p>

</body>
</html>
